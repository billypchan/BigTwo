name: BigTwo
options:
  bundleIdPrefix: com.billchan
  developmentLanguage: en
  knownRegions: [en, Base, zh-Hant, zh-Hans, id, fil, ms, vi]
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  BigTwoKit:
    path: BigTwoKit

# SDK, team, Swift version: Configurations/Shared.xcconfig (included by Version.xcconfig).
# Do not set IPHONEOS_DEPLOYMENT_TARGET here — pbxproj would override the xcconfig.
configFiles:
  Debug: Configurations/Version.xcconfig
  Release: Configurations/Version.xcconfig

fileGroups:
  - Configurations/Shared.xcconfig

targets:

  BigTwo:
    type: application
    platform: iOS
    sources:
      - path: BigTwoApp
        type: syncedFolder
      - path: Shared
        type: syncedFolder
      - path: Resources
        type: syncedFolder
    dependencies:
      - package: BigTwoKit
      - target: BigTwoWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    info:
      path: Configurations/BigTwo-Info.plist
      properties:
        CFBundleDisplayName: Big Two
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations:
          - en
          - zh-Hant
          - zh-Hans
          - id
          - fil
          - ms
          - vi
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Light
        # White status bar over the dark bezel; SwiftUI can't style it per view on iOS 15.
        UIViewControllerBasedStatusBarAppearance: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.billchan.BigTwo

  BigTwoWatch:
    type: application
    platform: watchOS
    sources:
      - path: BigTwoWatch
        type: syncedFolder
      - path: Shared
        type: syncedFolder
      # The watch draws with the same palette and looks up the same keys as the phone.
      - path: BigTwoApp/Palette.swift
      - path: BigTwoApp/L10n.swift
      # Localizations only — the iOS asset catalog and the privacy manifest are the
      # phone app's, and a watch target must not carry them.
      - path: Resources
        excludes:
          - Assets.xcassets
          - PrivacyInfo.xcprivacy
    dependencies:
      - package: BigTwoKit
    info:
      path: Configurations/BigTwoWatch-Info.plist
      properties:
        CFBundleDisplayName: Big Two
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.billchan.BigTwo
        CFBundleLocalizations:
          - en
          - zh-Hant
          - zh-Hans
          - id
          - fil
          - ms
          - vi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.billchan.BigTwo.watchkitapp
        WATCHOS_DEPLOYMENT_TARGET: 10.0
        TARGETED_DEVICE_FAMILY: 4
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The watch app is its own product; the shared xcconfig targets iPhone only.
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: watchos watchsimulator

  BigTwoWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: BigTwoWatchUITests
    dependencies:
      - target: BigTwoWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.billchan.BigTwoWatchUITests
        TEST_TARGET_NAME: BigTwoWatch
        GENERATE_INFOPLIST_FILE: YES
        WATCHOS_DEPLOYMENT_TARGET: 10.0
        TARGETED_DEVICE_FAMILY: 4
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: watchos watchsimulator
        # XCUIApplication is @MainActor; Swift 6 would need isolation on every test.
        SWIFT_VERSION: "5.0"

  BigTwoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BigTwoUITests
        type: syncedFolder
    dependencies:
      - target: BigTwo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.billchan.BigTwoUITests
        TEST_TARGET_NAME: BigTwo
        GENERATE_INFOPLIST_FILE: YES
        # XCUIApplication is @MainActor; Swift 6 mode would need isolation on every test.
        SWIFT_VERSION: "5.0"

schemes:
  BigTwoWatch:
    build:
      targets:
        BigTwoWatch: all
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - BigTwoWatchUITests
    run:
      # So a purchase can be made against the local product rather than the real store.
      storeKitConfiguration: Configurations/BigTwo.storekit

  BigTwo:
    build:
      targets:
        BigTwo: all
    test:
      config: Debug
      gatherCoverageData: false
      preActions:
        - name: Freeze status bar clock
          script: |
            # Ignore failure if the destination is not booted yet.
            "${SRCROOT}/scripts/freeze_status_bar.sh" booted || true
          settingsTarget: BigTwo
      targets:
        - BigTwoUITests

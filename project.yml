name: BigTwo
options:
  bundleIdPrefix: com.billchan
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  BigTwoKit:
    path: BigTwoKit

# SDK, team, Swift version: Configurations/Shared.xcconfig (included by Version.xcconfig).
# Do not set IPHONEOS_DEPLOYMENT_TARGET here — pbxproj would override the xcconfig.
configFiles:
  Debug: Configurations/Version.xcconfig
  Release: Configurations/Version.xcconfig

fileGroups:
  - Configurations/Shared.xcconfig

targets:

  BigTwo:
    type: application
    platform: iOS
    sources:
      - path: BigTwoApp
        type: syncedFolder
      - path: Resources
        type: syncedFolder
    dependencies:
      - package: BigTwoKit
    info:
      path: Configurations/BigTwo-Info.plist
      properties:
        CFBundleDisplayName: Big Two
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Light
        # White status bar over the dark bezel; SwiftUI can't style it per view on iOS 15.
        UIViewControllerBasedStatusBarAppearance: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.billchan.BigTwo

  BigTwoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BigTwoUITests
        type: syncedFolder
    dependencies:
      - target: BigTwo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.billchan.BigTwoUITests
        TEST_TARGET_NAME: BigTwo
        GENERATE_INFOPLIST_FILE: YES
        # XCUIApplication is @MainActor; Swift 6 mode would need isolation on every test.
        SWIFT_VERSION: "5.0"

schemes:
  BigTwo:
    build:
      targets:
        BigTwo: all
    test:
      config: Debug
      gatherCoverageData: false
      preActions:
        - name: Freeze status bar clock
          script: |
            # Ignore failure if the destination is not booted yet.
            "${SRCROOT}/scripts/freeze_status_bar.sh" booted || true
          settingsTarget: BigTwo
      targets:
        - BigTwoUITests

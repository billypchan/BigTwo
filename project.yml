name: BigTwo
options:
  bundleIdPrefix: com.billchan
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  BigTwoKit:
    path: BigTwoKit

settings:
  base:
    DEVELOPMENT_TEAM: G5GZ5MPEHS
    SWIFT_VERSION: "6.0"
    # Without this the AccentColor colorset is inert; its components must match
    # `Color.feltDeep` (BigTwoApp/Palette.swift).
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

configFiles:
  Debug: Configurations/Version.xcconfig
  Release: Configurations/Version.xcconfig

targets:

  BigTwo:
    type: application
    platform: iOS
    sources:
      - path: BigTwoApp
        type: syncedFolder
      - path: Resources
        type: syncedFolder
    dependencies:
      - package: BigTwoKit
    info:
      path: Configurations/BigTwo-Info.plist
      properties:
        CFBundleDisplayName: Big Two
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Light
        # White status bar over the dark bezel; SwiftUI can't style it per view on iOS 15.
        UIViewControllerBasedStatusBarAppearance: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.billchan.BigTwo
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  BigTwoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BigTwoUITests
        type: syncedFolder
    dependencies:
      - target: BigTwo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.billchan.BigTwoUITests
        TEST_TARGET_NAME: BigTwo
        GENERATE_INFOPLIST_FILE: YES
        # XCUIApplication is @MainActor; Swift 6 mode would need isolation on every test.
        SWIFT_VERSION: "5.0"

schemes:
  BigTwo:
    build:
      targets:
        BigTwo: all
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - BigTwoUITests
